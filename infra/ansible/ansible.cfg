[defaults]
inventory = inventory.ini
roles_path = roles
stdout_callback = yaml
interpreter_python = auto_silent
# Секреты приходят переменными, и в выводе их быть не должно.
no_log = False

[ssh_connection]
pipelining = True
# accept-new, а не no: ключ хоста запоминается при первом подключении и
# сверяется дальше. Полное отключение проверки оставило бы дорогу «человеку
# посередине» к базе с персональными данными.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
