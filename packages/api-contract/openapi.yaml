openapi: 3.1.0

info:
  title: Траектория — API мини-приложения
  version: 1.0.0
  description: |
    REST-контракт между мини-приложением (apps/web) и `fn: api` (apps/api).
    Источник истины: раздел 10 ТЗ (docs/TZ.md) и схема БД
    (packages/db/migrations/0001_init.sql). Номера функций из ТЗ §4 проставлены
    в `x-tz` у каждой операции.

    Соглашения:
      * все поля на проводе — snake_case, как колонки БД и как уже устроен
        packages/shared/maxapi/types.go; трансформера камелизации нет;
      * даты и时间 — RFC 3339 в UTC (`2026-09-25T20:59:00Z`), «только дата» — `2026-09-25`;
      * ошибка всегда `{"error": {"code", "message"}}` — ТЗ §10;
      * `message` написан по-русски и пригоден для показа пользователю как есть;
      * права проверяет сервер (ТЗ §3.1); клиент получает готовые флаги в `/session`
        и рисует по ним кнопки, но не полагается на них как на защиту.

    Идентификаторы: всё, что связано с олимпиадой, адресуется по
    `olympiad_profile_id` — льгота в ТЗ §6.2 это связка «профиль + вуз + год»,
    и трекер в схеме БД ссылается именно на профиль. Каталог при этом показывает
    по одной строке на олимпиаду и отдаёт в `primary_profile` тот профиль,
    который нужно открыть.

servers:
  - url: /api/v1
    description: Локально — через nginx-прокси мини-приложения (same-origin)
  - url: https://{function}.apigw.yandexcloud.net/api/v1
    description: Прод — Cloud Function
    variables:
      function:
        default: example

security:
  - bearerAuth: []

tags:
  - name: session
  - name: home
  - name: olympiads
  - name: universities
  - name: tracker
  - name: proposals
  - name: family
  - name: profile
  - name: ai

paths:

  /session:
    post:
      tags: [session]
      summary: initData → JWT, текущая траектория, роль, права
      x-tz: "F12"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  description: Подписанная строка запуска MAX Bridge. Проверяется по ТЗ §11.3.
                start_param:
                  type: [string, "null"]
                  maxLength: 512
                  description: Payload диплинка `startapp=`, если мини-приложение открыто по ссылке.
      responses:
        "200":
          description: Сессия выдана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Подпись верна, но у пользователя нет траектории — нужно пройти онбординг у бота
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /home:
    get:
      tags: [home]
      summary: Цель, счётчики, следующий шаг, ближайшие сроки
      x-tz: "F34, F47"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /recommendations:
    get:
      tags: [olympiads]
      summary: Подбор олимпиад под цель плюс блок «вне перечня»
      description: |
        Скоринг и сортировка — на сервере (ТЗ §6.1). Клиент показывает `items`
        в том порядке, в котором они пришли, и не пересчитывает ничего сам.
        Подходящая олимпиада — та, во что ещё можно вступить (срок первого этапа
        не прошёл); перечневая — только с льготой в вузах ученика. Уже добавленное
        в трекер и предложенное не показывается.
      x-tz: "F13, F14, F15, F16"
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, level1, soon, online]
            default: all
          description: |
            Чипы экрана C3. `level1` — только I уровень, `soon` — дедлайн не дальше
            16 дней, `online` — есть онлайн-отбор.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendations" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /olympiads:
    get:
      tags: [olympiads]
      summary: Каталог олимпиад
      x-tz: "F24, F27, F66"
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: Поиск по названию и организатору, без учёта регистра.
        - name: subject
          in: query
          schema: { type: string }
          description: Код предмета, `subjects.code`.
        - name: city
          in: query
          schema: { type: string }
          description: Город финала, `olympiads.final_city`.
        - name: mine
          in: query
          schema: { type: boolean }
          description: |
            «Ведут в мои вузы и на мои направления»: только олимпиады с БВИ,
            БВИ победителям или 100 баллами в вузах ученика — на его
            направления по правилу целей (выбранные в вузе, иначе из цели,
            иначе вуз целиком). Без вузов список пуст. С `subject` и `q` — «и».
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OlympiadListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /olympiads/{id}:
    get:
      tags: [olympiads]
      summary: Карточка олимпиады
      description: |
        `id` — это `olympiad_profile_id`. Ответ содержит все профили той же
        олимпиады (`profiles`) для блока «Уровень по профилям», льготу в вузах
        ученика, условия, этапы и примеры вузов.
      x-tz: "F17, F18, F19, F20, F21, F22, F23"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OlympiadDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /universities:
    get:
      tags: [universities]
      summary: Каталог вузов
      x-tz: "F25, F27, F67"
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: city
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string }
          description: |
            `directions.id`: только вузы, где есть направление, покрывающее
            это (коды равны или один — укрупнённая группа XX.00.00). Сначала —
            где больше олимпиад с льготой на нём, вузы с непроверенными
            льготами — в конце. Нет направления — 400.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogUniversity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /universities/{id}:
    get:
      tags: [universities]
      summary: Карточка вуза
      x-tz: "F25, F26"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: "`universities.id`"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /directions:
    get:
      tags: [profile]
      summary: Направления — справочник целей для правки профиля
      description: |
        Все направления вузов из датасета (72). `popular` — основные 16, те же, что в онбординге
        бота: их профиль показывает чипами, остальные — в выборе с поиском (F65).
      x-tz: "F8, F49, F65"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DirectionOption" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tracker:
    get:
      tags: [tracker]
      summary: Пункты трекера и предложения
      x-tz: "F31, F45"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tracker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tracker]
      summary: Добавить олимпиаду в трекер
      description: |
        Повторное добавление того же профиля не создаёт дубль и отвечает 200
        с уже существующим пунктом. Если в траектории есть ученик, родителю
        здесь отвечают 403 — ему доступен только `POST /proposals` (ТЗ §3.1).
      x-tz: "F28"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [olympiad_profile_id]
              properties:
                olympiad_profile_id: { type: string }
      responses:
        "201":
          description: Пункт создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackerItem" }
        "200":
          description: Пункт уже был в трекере
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackerItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tracker/{id}:
    delete:
      tags: [tracker]
      summary: Убрать олимпиаду из трекера
      x-tz: "F28"
      parameters:
        - $ref: "#/components/parameters/TrackerItemId"
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tracker/{id}/registered:
    put:
      tags: [tracker]
      summary: Отметить «зарегистрирован»
      description: |
        Отметку ставит любой участник. Остальные получают уведомление от бота,
        напоминания о регистрации по этой олимпиаде отменяются у всех (ТЗ §6.3).
      x-tz: "F46"
      parameters:
        - $ref: "#/components/parameters/TrackerItemId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackerItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tracker]
      summary: Снять отметку «зарегистрирован»
      x-tz: "F46"
      parameters:
        - $ref: "#/components/parameters/TrackerItemId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackerItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: На регистрации держатся итоги этапов — сначала снять их
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tracker/{id}/stages/{stage_id}:
    put:
      tags: [tracker]
      summary: Отметить этап — регистрацию или итог
      description: |
        Отметку ставит любой участник, остальные получают сообщение от бота.
        Тело — вся отметка этапа: `{registered: false, result: null}` снимает её.
        Итог подразумевает регистрацию на олимпиаду. `failed`, `winner`,
        `prizer` и `participant` заканчивают участие: следующие этапы
        становятся `locked`, напоминания по олимпиаде отменяются. Первая
        регистрация — то же, что `PUT /tracker/{id}/registered`.
      x-tz: "F63"
      parameters:
        - $ref: "#/components/parameters/TrackerItemId"
        - name: stage_id
          in: path
          required: true
          schema: { type: string }
          description: "`stages.id` этапа этой олимпиады"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registered:
                  type: boolean
                  description: Регистрация на этап; у этапов без регистрации игнорируется.
                result:
                  oneOf:
                    - $ref: "#/components/schemas/StageResult"
                    - type: "null"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackerItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Отметка противоречит другим: этап после закрывающего итога,
            закрывающий итог при отметках дальше
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /calendar:
    get:
      tags: [tracker]
      summary: Сроки месяца
      x-tz: "F32"
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          example: "2026-10"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarMonth" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /calendar/link:
    get:
      tags: [tracker]
      summary: Ссылка на файл календаря со сроками
      description: |
        Файл .ics забирает браузер телефона или MAX, а не мини-приложение, —
        заголовок Authorization им не передать. Поэтому сначала выдаётся
        ссылка: путь относительно базового адреса API с подписанным токеном.
        Ссылка живёт десять минут и открывает только календарь своей семьи.
      x-tz: "F32"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /calendar.ics:
    get:
      tags: [tracker]
      summary: Файл календаря (.ics) со всеми будущими сроками трекера
      description: |
        Без сессии: доступ по токену из GET /calendar/link. Срок этапа —
        событие на весь день по Москве с напоминанием накануне в 9:00. Этапы,
        закрытые отметкой «зарегистрирован», не выгружаются. Просроченный,
        чужой или испорченный токен и удалённый участник — 404.
      x-tz: "F32"
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Календарь RFC 5545
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /proposals:
    post:
      tags: [proposals]
      summary: Предложить олимпиаду ученику
      description: Доступно родителю, когда ученик есть в траектории (ТЗ §3.1).
      x-tz: "F45"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [olympiad_profile_id]
              properties:
                olympiad_profile_id: { type: string }
      responses:
        "201":
          description: Предложение создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "200":
          description: Предложение по этому профилю уже ждёт ответа
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Олимпиада уже в трекере
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /proposals/{id}/accept:
    post:
      tags: [proposals]
      summary: Ученик принимает предложение — олимпиада попадает в трекер
      x-tz: "F45"
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [proposal, tracker_item]
                properties:
                  proposal: { $ref: "#/components/schemas/Proposal" }
                  tracker_item: { $ref: "#/components/schemas/TrackerItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Предложение уже закрыто
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /proposals/{id}/decline:
    post:
      tags: [proposals]
      summary: Ученик отклоняет предложение
      x-tz: "F45"
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Предложение уже закрыто
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /family:
    get:
      tags: [family]
      summary: Участники, создатель, активные ссылки
      x-tz: "F38, F43"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /family/invites:
    post:
      tags: [family]
      summary: Новая одноразовая ссылка-приглашение
      description: |
        Роль приглашённого выбирает тот, кто создаёт ссылку. Если ученик в
        траектории уже есть, доступна только роль `parent` (ТЗ §4.9, F42).
      x-tz: "F39, F40"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Ссылка создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Ученик в траектории уже есть, вторую роль `kid` выдать нельзя
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /family/invites/{id}:
    delete:
      tags: [family]
      summary: Отозвать неиспользованную ссылку
      description: |
        Отзывает автор ссылки или создатель траектории (ТЗ §16). Чужая,
        уже использованная или отозванная ссылка — 404.
      x-tz: "F39"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Ссылка отозвана }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /family/members/{id}:
    delete:
      tags: [family]
      summary: Удалить участника
      description: Только создатель и только не себя (ТЗ §3.1, F41).
      x-tz: "F41"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Участник удалён }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /family/leave:
    post:
      tags: [family]
      summary: Выйти из траектории
      description: Создатель выйти не может — только удалить траекторию через /delete у бота (ТЗ §3.2).
      x-tz: "F48"
      responses:
        "204": { description: Вышли }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /profile:
    get:
      tags: [profile]
      summary: Профиль ученика
      x-tz: "F49"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [profile]
      summary: Правка профиля ученика
      description: |
        Изменения видят все участники. Передаются только меняемые поля.
        `subject_codes` и `university_ids` — не меньше одного элемента.
      x-tz: "F49"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /profile/universities:
    put:
      tags: [profile]
      summary: Заменить список вузов ученика
      description: |
        Отдельная ручка, потому что список вузов меняется не только из профиля,
        а ещё кнопкой «Добавить в мои вузы» в карточке вуза (ТЗ §10, F9/F25/F49).
      x-tz: "F9, F25, F49"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [university_ids]
              properties:
                university_ids:
                  type: array
                  description: Может быть пустым — вузы выбирать не обязательно (F9).
                  items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profile/universities/{id}/directions:
    put:
      tags: [profile]
      summary: Выбрать направления в вузе
      description: |
        Заменяет выбор направлений ученика в вузе (F65). Вуз становится «моим», новые направления
        дописываются в цель (`goal_status` → `known`). Пустой список снимает выбор, цель не меняется.
        Льготы в этом вузе дальше считаются на выбранные направления.
      x-tz: "F65"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction_ids]
              properties:
                direction_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/chats:
    get:
      tags: [ai]
      summary: Чаты с помощником
      description: |
        Свои чаты участника, свежие сверху — по времени последней реплики.
        Другим участникам не видны (ТЗ F37). Пустых чатов не бывает: чат
        появляется вместе с первым вопросом.
      x-tz: "F37, F58"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AiChat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ai]
      summary: Новый чат с первым вопросом
      description: |
        Создаёт чат и сразу отвечает на первый вопрос. Название — «Чат 23
        сентября» по дню вопроса в часовом поясе траектории (ТЗ F59).
      x-tz: "F35, F36, F58, F59"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiQuestion" }
      responses:
        "201":
          description: Чат создан, ответ помощника
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiExchange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /ai/chats/{id}:
    patch:
      tags: [ai]
      summary: Переименовать чат
      description: Пробелы по краям отбрасываются; остаётся от 1 до 60 символов (ТЗ F59).
      x-tz: "F59"
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChat" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/chats/{id}/messages:
    get:
      tags: [ai]
      summary: Реплики чата
      description: 50 последних реплик, от старых к новым.
      x-tz: "F37, F58"
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AiMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ai]
      summary: Вопрос помощнику в чате
      description: |
        RAG только по нашей базе. Карточки ищутся по тексту этого вопроса;
        модель видит ещё 10 предыдущих реплик чата и карточки, на которые
        ссылались ответы в них (ТЗ F60). Если ответа в базе нет, приходит
        `refused: true` и шаблон отказа со ссылкой на первоисточник (ТЗ F36).
      x-tz: "F35, F36, F60"
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiQuestion" }
      responses:
        "200":
          description: Ответ помощника
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiExchange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT из `POST /session`, HS256, живёт час (ТЗ §8.2).

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: "`olympiad_profiles.id`"
    TrackerItemId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: "`tracker_items.id`"
    ProposalId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: "`proposals.id`"
    ChatId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: "`ai_chats.id`. Чужой чат для участника не существует — 404 (ТЗ F37)."

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Нет или истёк JWT — клиент повторяет POST /session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Действие запрещено матрицей прав ТЗ §3.1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Слишком часто
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - NOT_IMPLEMENTED
                - INTERNAL
            message:
              type: string
              description: Текст по-русски, показывается пользователю как есть.

    Role:
      type: string
      enum: [kid, parent]

    OlympiadKind:
      type: string
      enum: [perechen, vsosh, other]
      description: "`olympiads.kind`"

    Level:
      type: [string, "null"]
      enum: ["I", "II", "III", null]
      description: Уровень профиля по перечню. `null` у ВсОШ и у олимпиад вне перечня.

    BenefitKind:
      type: string
      enum: [bvi, score100, bvi_winners, extra_points]
      description: "`benefits.benefit`"

    StageKind:
      type: string
      enum: [registration, qualifying, final, school, municipal, regional]

    Source:
      type: object
      description: |
        Источник факта. Без него запись нельзя показывать с меткой «Факт» (ТЗ §6.2),
        клиент в этом случае рисует «данные уточняются».
      required: [id, kind, title, url]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [order, rules, site]
        title: { type: string, examples: ["Перечень олимпиад, приказ № 669"] }
        url: { type: string, format: uri }
        verified_at:
          type: [string, "null"]
          format: date
          description: Дата проверки. `null` — показывать без метки «Факт».

    Badge:
      type: object
      description: |
        Оформление плитки. Оба поля могут быть `null`: клиент тогда строит
        аббревиатуру из названия и цвет из хеша идентификатора (src/lib/badge.ts),
        поэтому заполнять их на сервере необязательно.
      required: [short_name, color]
      properties:
        short_name:
          type: [string, "null"]
          maxLength: 4
          examples: ["ВП"]
        color:
          type: [string, "null"]
          pattern: '^#[0-9A-Fa-f]{6}$'
          examples: ["#6B2BFF"]

    Permissions:
      type: object
      description: Вычисляются сервером по матрице ТЗ §3.1 для текущего участника.
      required:
        [
          add_to_tracker,
          remove_from_tracker,
          propose,
          resolve_proposals,
          toggle_registered,
          edit_profile,
          invite,
          remove_members,
          leave,
          delete_trajectory,
        ]
      properties:
        add_to_tracker: { type: boolean }
        remove_from_tracker: { type: boolean }
        propose: { type: boolean }
        resolve_proposals: { type: boolean }
        toggle_registered: { type: boolean }
        edit_profile: { type: boolean }
        invite: { type: boolean }
        remove_members: { type: boolean }
        leave: { type: boolean }
        delete_trajectory: { type: boolean }

    SessionResponse:
      type: object
      required: [token, expires_at, session]
      properties:
        token: { type: string, description: JWT HS256 }
        expires_at: { type: string, format: date-time }
        session: { $ref: "#/components/schemas/Session" }

    Session:
      type: object
      required: [user, member, trajectory, permissions, start_param]
      properties:
        user:
          type: object
          required: [id, max_user_id, first_name]
          properties:
            id: { type: string, format: uuid }
            max_user_id: { type: integer, format: int64 }
            first_name:
              type: string
              description: Имя смотрящего. В текстах подставляется как `{me}`.
        member:
          type: object
          required: [id, role, is_creator, reminder_offsets]
          properties:
            id: { type: string, format: uuid }
            role: { $ref: "#/components/schemas/Role" }
            is_creator: { type: boolean }
            reminder_offsets:
              type: array
              items: { type: integer, enum: [30, 7, 3, 1] }
        trajectory: { $ref: "#/components/schemas/TrajectorySummary" }
        permissions: { $ref: "#/components/schemas/Permissions" }
        start_param:
          type: [string, "null"]
          description: Разобранный payload диплинка, если мини-приложение открыто по ссылке.

    TrajectorySummary:
      type: object
      required:
        [
          id,
          student_name,
          grade,
          region_code,
          region_name,
          directions,
          goal_status,
          has_kid,
          members_count,
        ]
      properties:
        id: { type: string, format: uuid }
        student_name:
          type: string
          description: Имя ученика. В текстах подставляется как `{student}`.
        grade: { type: integer, enum: [8, 9, 10, 11] }
        region_code:
          type: string
          examples: ["16"]
          description: Код субъекта РФ; пустая строка — регион не указан («Не важно»), напоминания по московскому времени.
        region_name:
          type: string
          examples: ["Республика Татарстан"]
          description: Пустая строка, если регион не указан.
        directions:
          type: array
          description: Направления-цели в порядке выбора (F8). Пусто — ученик пока не решил.
          items: { $ref: "#/components/schemas/Direction" }
        goal_status:
          type: string
          description: |
            known — направления выбраны, exploring — пока не решил,
            suggested — старые траектории, где цель предлагал опросник.
          enum: [known, suggested, exploring]
        has_kid:
          type: boolean
          description: |
            Есть ли в траектории активный участник с ролью `kid`. От этого
            зависит, добавляет родитель олимпиаду сам или предлагает (ТЗ §3.2).
        members_count: { type: integer }

    NextStep:
      type: object
      description: Ближайший незарегистрированный пункт трекера (ТЗ §6.6).
      required:
        [tracker_item_id, olympiad_profile_id, olympiad_name, stage_title, stage_kind, deadline_at]
      properties:
        tracker_item_id: { type: string, format: uuid }
        olympiad_profile_id: { type: string }
        olympiad_name: { type: string }
        stage_title:
          type: string
          description: "«Регистрация» или название этапа ВсОШ — «Школьный этап»."
        stage_kind: { $ref: "#/components/schemas/StageKind" }
        deadline_at: { type: [string, "null"], format: date-time }

    Home:
      type: object
      required:
        [
          trajectory,
          tracker_count,
          registered_count,
          universities_count,
          pending_proposals_count,
          next_step,
          upcoming,
        ]
      properties:
        trajectory: { $ref: "#/components/schemas/TrajectorySummary" }
        tracker_count: { type: integer }
        registered_count: { type: integer }
        universities_count: { type: integer }
        pending_proposals_count:
          type: integer
          description: Предложения, ждущие ответа ученика. Учитывается в бейдже вкладки «Трекер».
        next_step:
          oneOf:
            - $ref: "#/components/schemas/NextStep"
            - type: "null"
          description: "`null`, когда всё отмечено — экран показывает «Всё по плану»."
        upcoming:
          type: array
          description: Три ближайших срока из трекера.
          items: { $ref: "#/components/schemas/TrackerItem" }

    Recommendations:
      type: object
      required: [items, more, outside, note, tracked_count, proposed_count, state]
      properties:
        items:
          type: array
          description: |
            Перечень и ВсОШ, уже отсортированы сервером. Клиент порядок не меняет.
            Только то, чего нет в трекере и что не ждёт ответа на предложение:
            места добавленных занимают следующие по скору (C3).
          items: { $ref: "#/components/schemas/OlympiadCard" }
        more:
          type: array
          description: |
            Остальные подходящие олимпиады перечня по убыванию скора — «Показать ещё N».
            Добавленные сюда тоже не попадают.
          items: { $ref: "#/components/schemas/OlympiadCard" }
        tracked_count:
          type: integer
          minimum: 0
          description: Сколько подходящих под фильтр олимпиад спрятано, потому что они уже в трекере.
        proposed_count:
          type: integer
          minimum: 0
          description: Сколько подходящих под фильтр олимпиад спрятано, потому что ждут ответа на предложение.
        state:
          type: string
          enum: [ok, all_tracked, all_proposed, none_suitable]
          description: |
            `ok` — есть что показать; `all_tracked` — всё подходящее уже в трекере (C7);
            `all_proposed` — остальное ждёт ответа на предложение; `none_suitable` — подходящих
            нет: регистрации закрыты или в вузах ученика нет льгот по его предметам.
        outside:
          type: array
          description: Олимпиады вне перечня — отдельный блок, с основным списком не смешиваются (F16).
          items: { $ref: "#/components/schemas/OlympiadCard" }
        note:
          type: string
          examples: ["Сначала ближайшие сроки и точное совпадение профиля"]

    OlympiadCard:
      allOf:
        - $ref: "#/components/schemas/Badge"
        - type: object
          required:
            [
              olympiad_profile_id,
              olympiad_id,
              name,
              organizer,
              kind,
              level,
              subject_code,
              subject_name,
              format,
              is_online,
              final_city,
              deadline_at,
              next_stage_title,
              benefits_summary,
              reason,
              in_tracker,
              proposal_status,
              registration_closed,
            ]
          properties:
            olympiad_profile_id: { type: string }
            olympiad_id: { type: string }
            name: { type: string }
            organizer: { type: [string, "null"] }
            kind: { $ref: "#/components/schemas/OlympiadKind" }
            level: { $ref: "#/components/schemas/Level" }
            subject_code: { type: string }
            subject_name: { type: string }
            format:
              type: [string, "null"]
              examples: ["Онлайн-отбор"]
            is_online: { type: boolean }
            final_city: { type: [string, "null"] }
            deadline_at: { type: [string, "null"], format: date-time }
            next_stage_title:
              type: [string, "null"]
              examples: ["Регистрация", "Школьный этап"]
            benefits_summary:
              type: string
              description: "Строка о льготе в вузах ученика — «Иннополис, ВШЭ: БВИ» или «В твоих вузах льгот нет»."
              examples: ["Иннополис, ВШЭ: БВИ"]
            reason:
              type: string
              description: Причина рекомендации, 1–2 самых сильных фактора (ТЗ §6.1 п. 6).
              examples: ["Профиль совпадает с целью"]
            in_tracker: { type: boolean }
            proposal_status:
              type: [string, "null"]
              enum: [pending, null]
              description: "`pending` — родитель уже предложил, ученик ещё не ответил."
            registration_closed:
              type: boolean
              description: |
                Срок первого этапа (регистрации) прошёл — вступить в этом сезоне нельзя, хотя следующий
                этап может быть ещё впереди. В «Подборе» всегда `false`: закрытые туда не попадают.

    OlympiadListItem:
      allOf:
        - $ref: "#/components/schemas/Badge"
        - type: object
          description: Строка каталога — одна на олимпиаду, а не на профиль.
          required: [olympiad_id, name, kind, primary_profile, registration_closed, my_benefits]
          properties:
            olympiad_id: { type: string }
            name: { type: string }
            organizer: { type: [string, "null"] }
            kind: { $ref: "#/components/schemas/OlympiadKind" }
            final_city: { type: [string, "null"] }
            primary_profile:
              type: object
              description: Профиль, который откроется по тапу — совпадающий с предметами ученика либо первый.
              required: [olympiad_profile_id, subject_code, subject_name, level]
              properties:
                olympiad_profile_id: { type: string }
                subject_code: { type: string }
                subject_name: { type: string }
                level: { $ref: "#/components/schemas/Level" }
            profiles_count: { type: integer }
            registration_closed:
              type: boolean
              description: По основному профилю — срок первого этапа прошёл.
            my_benefits:
              type: array
              description: |
                С `mine=true` — льгота основного профиля в моих вузах на мои
                направления, от сильной к слабой. Без фильтра — пустой массив.
              items: { $ref: "#/components/schemas/MyBenefit" }

    MyBenefit:
      type: object
      description: Льгота в моих вузах и вузы, где она даётся.
      required: [benefit, benefit_label, universities, partial_universities]
      properties:
        benefit: { type: string, enum: [bvi, bvi_winners, score100] }
        benefit_label: { type: string }
        universities:
          type: array
          description: Короткие названия моих вузов, в их порядке в профиле.
          items: { type: string }
        partial_universities:
          type: array
          description: >-
            Из universities — вузы, где на мои направления льгота не на все
            программы («Зависит от программы» в карточке олимпиады).
          items: { type: string }

    ProfileLevel:
      type: object
      description: Строка блока «Уровень по профилям».
      required: [olympiad_profile_id, subject_code, subject_name, level, is_mine]
      properties:
        olympiad_profile_id: { type: string }
        subject_code: { type: string }
        subject_name: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        is_mine:
          type: boolean
          description: Профиль ученика — выделяется в интерфейсе.

    BenefitGrant:
      type: object
      description: Что получит победитель или призёр в вузе.
      required: [kind, label]
      properties:
        kind: { type: string, enum: [bvi, score100, extra_points] }
        label:
          type: string
          description: Готовая подпись — «БВИ», «100 баллов», «+3 балла».

    BenefitColumn:
      type: string
      enum: [winner, prizer, ege, extra_points]
      description: |
        Столбец таблицы льгот (F18, F19): `winner` и `prizer` — что получат победитель и призёр,
        `ege` — порог ЕГЭ, `extra_points` — доп. баллы у олимпиад вне перечня.

    BenefitRow:
      type: object
      description: |
        Льгота в конкретном вузе. `benefit: null` означает «не учитывает».
        Если `source` пуст, клиент не ставит метку «Факт» и пишет «данные уточняются» (F18).
      required:
        [
          university_id,
          university_name,
          university_short_name,
          university_nick,
          city,
          benefit,
          benefit_label,
          winner,
          prizer,
          ege_min,
          ege_max,
          source,
          directions,
          other_directions,
          unverified,
          varies,
          directions_count,
          directions_total,
        ]
      properties:
        university_id: { type: string }
        university_name: { type: string }
        university_short_name: { type: string }
        university_nick:
          type: string
          description: Как вуз называют коротко в таблице и тексте — «ВШЭ», «Иннополис».
        city: { type: [string, "null"] }
        color: { type: [string, "null"], pattern: '^#[0-9A-Fa-f]{6}$' }
        benefit:
          oneOf:
            - $ref: "#/components/schemas/BenefitKind"
            - type: "null"
        benefit_label:
          type: [string, "null"]
          description: Готовая подпись — «БВИ», «100 баллов», «БВИ победителям», «доп. баллы».
        winner:
          description: Что получит победитель; `null` — вуз олимпиаду не учитывает.
          oneOf:
            - $ref: "#/components/schemas/BenefitGrant"
            - type: "null"
        prizer:
          description: Что получит призёр; `null` — призёру льготы нет или вуз олимпиаду не учитывает.
          oneOf:
            - $ref: "#/components/schemas/BenefitGrant"
            - type: "null"
        extra_points: { type: [integer, "null"] }
        ege_min: { type: [integer, "null"] }
        ege_max:
          type: [integer, "null"]
          description: Верхняя граница порога, если он зависит от программы — «75–85».
        diploma_grades:
          type: [array, "null"]
          items: { type: integer }
        note: { type: [string, "null"] }
        source:
          oneOf:
            - $ref: "#/components/schemas/Source"
            - type: "null"
        conditions:
          type: array
          description: |
            Чем условия в этом вузе отличаются от общих `OlympiadDetail.conditions`, кроме того, что
            видно в столбцах таблицы (F19): другой предмет ЕГЭ, класс диплома — только если вуз не
            засчитает диплом этого года. Есть только в `OlympiadDetail.benefits`, пусто — поля нет.
          items: { type: string }
          examples: [["Призёру — 100 баллов вместо БВИ", "Порог ЕГЭ от 75 до 80 — зависит от программы"]]
        directions:
          type: array
          description: |
            На какие направления вуза эта льгота (F65): в вузах ученика — его направления (выбранные
            в вузе или из цели); пусто — льгота вуза целиком. В строке «не учитывает» — направления,
            на которые льготы нет.
          items: { type: string }
          examples: [["Программная инженерия"]]
        other_directions:
          type: array
          description: Более слабые льготы на остальных направлениях ученика в этом вузе.
          items: { $ref: "#/components/schemas/DirectionBenefit" }
        unverified:
          type: boolean
          description: Льготы на направления ученика в вузе ещё уточняются — показана льгота вуза целиком.
        varies:
          type: boolean
          description: Льгота или порог зависит от программы внутри направления.
        directions_count:
          type: integer
          description: "«Где ещё даёт льготу»: на скольких направлениях вуза есть льгота."
        directions_total:
          type: integer
          description: Сколько направлений у вуза в данных; 0 — данных по направлениям нет.

    DirectionBenefit:
      type: object
      required: [benefit, benefit_label, directions, winner, prizer]
      properties:
        benefit: { $ref: "#/components/schemas/BenefitKind" }
        benefit_label: { type: string }
        directions:
          type: array
          items: { type: string }
        winner:
          description: Что получит победитель на этих направлениях.
          oneOf:
            - $ref: "#/components/schemas/BenefitGrant"
            - type: "null"
        prizer:
          description: Что получит призёр; `null` — призёру льготы нет.
          oneOf:
            - $ref: "#/components/schemas/BenefitGrant"
            - type: "null"

    Stage:
      type: object
      required: [id, kind, title, subtitle, deadline_at, is_online, state]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/StageKind" }
        title:
          type: string
          examples: ["Регистрация", "Отборочный этап", "Заключительный этап"]
        subtitle:
          type: [string, "null"]
          description: Человеческая подпись под этапом — «до 25 сентября», «октябрь — ноябрь, онлайн».
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        deadline_at: { type: [string, "null"], format: date-time }
        is_online: { type: boolean }
        state:
          type: string
          enum: [past, current, future]
          description: "Для таймлайна: пройденные серым, ближайший выделен (F21)."

    OlympiadDetail:
      allOf:
        - $ref: "#/components/schemas/OlympiadCard"
        - type: object
          required:
            [
              official_url,
              description,
              profiles,
              profiles_source,
              benefits,
              benefits_source,
              conditions,
              stages,
              stages_are_demo,
              why,
              benefit_universities,
              benefit_columns,
            ]
          properties:
            official_url: { type: [string, "null"], format: uri }
            description:
              type: [string, "null"]
              description: Что это за олимпиада — пара предложений по официальному сайту. Пусто — блок не показывается.
            profiles:
              type: array
              description: Все профили этой олимпиады, профиль ученика помечен `is_mine` (F17).
              items: { $ref: "#/components/schemas/ProfileLevel" }
            profiles_source:
              oneOf:
                - $ref: "#/components/schemas/Source"
                - type: "null"
            benefits:
              type: array
              description: |
                По строке на каждый вуз ученика, включая «не учитывает» (F18). Сначала самые выгодные,
                дальше по алфавиту `university_nick`; «не учитывает» — в конце.
              items: { $ref: "#/components/schemas/BenefitRow" }
            benefit_columns:
              type: array
              description: |
                Столбцы таблицы льгот. Вне перечня — только `extra_points`. `ege` — если порог в вузах
                ученика разный или зависит от программы; одинаковый — в общих `conditions`.
              items: { $ref: "#/components/schemas/BenefitColumn" }
            benefits_source:
              oneOf:
                - $ref: "#/components/schemas/Source"
                - type: "null"
            conditions:
              type: array
              description: |
                Общие условия подтверждения льготы в вузах ученика — диплом, ЕГЭ, «БВИ в один вуз» (F19).
                Порог ЕГЭ здесь, только если его нет в `benefit_columns`. Своё у вуза — в `benefits[].conditions`. Если вузы ученика льготы не дают, условия
                собраны по всем вузам базы и включают их особенности.
              items: { type: string }
            stages:
              type: array
              items: { $ref: "#/components/schemas/Stage" }
            stages_are_demo:
              type: boolean
              description: Ставит метку «Демо-даты» вместо «Факт», пока даты не выверены (ТЗ §0.5).
            why:
              type: string
              description: Блок «Почему подходит», метка «Рекомендация» (F20).
            benefit_universities:
              type: array
              description: Вузы базы, где эта олимпиада даёт льготу, кроме вузов ученика (они в benefits), — блок «Где ещё даёт льготу» (F23).
              items: { $ref: "#/components/schemas/BenefitRow" }

    Direction:
      type: object
      required: [id, name]
      properties:
        id: { type: string, examples: ["napr-09-03-04"] }
        name: { type: string, examples: ["Программная инженерия"] }

    DirectionOption:
      allOf:
        - $ref: "#/components/schemas/Direction"
        - type: object
          required: [code, groups, popular]
          properties:
            code: { type: string, examples: ["09.03.04"] }
            groups:
              type: array
              description: Группы для выбора с поиском — «ИТ», «Экономика».
              items: { type: string }
            popular:
              type: boolean
              description: Одно из основных направлений — показывается чипом.

    OfferedDirection:
      type: object
      required: [id, code, name, status, programs, budget_places, benefit_olympiads_count, is_mine, is_goal]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [offered, to_check]
          description: to_check — льготы на направлении ещё уточняются.
        programs: { type: integer }
        budget_places: { type: [integer, "null"] }
        benefit_olympiads_count:
          type: integer
          description: Сколько олимпиад дают льготу на это направление.
        is_mine:
          type: boolean
          description: Ученик выбрал это направление в вузе.
        is_goal:
          type: boolean
          description: Направление покрывает цель ученика.

    TargetBasis:
      type: string
      enum: [chosen, goal, university]
      description: |
        На что смотрятся льготы в вузе: chosen — выбранные в вузе направления, goal — направления
        вуза из цели, university — вуз целиком (ни выбора, ни совпадения с целью).

    UniversityListItem:
      type: object
      required: [id, short_name, nick, name, city, benefit_olympiads_count, is_mine]
      properties:
        id: { type: string }
        short_name: { type: string }
        nick:
          type: string
          description: Название в тексте — «Иннополис», а не «УИ»; обычно совпадает с `short_name`.
        name: { type: string }
        city: { type: [string, "null"] }
        color: { type: [string, "null"], pattern: '^#[0-9A-Fa-f]{6}$' }
        benefit_olympiads_count:
          type: integer
          description: Сколько олимпиад дают в этом вузе БВИ или 100 баллов.
        is_mine:
          type: boolean
          description: Вуз входит в список ученика.

    CatalogUniversity:
      allOf:
        - $ref: "#/components/schemas/UniversityListItem"
        - type: object
          properties:
            direction_match:
              type: object
              description: Только с фильтром `direction` — чем вуз под него подходит.
              required: [direction_ids, olympiads_count, status]
              properties:
                direction_ids:
                  type: array
                  description: Направления вуза, покрывающие искомое.
                  items: { type: string }
                olympiads_count:
                  type: integer
                  description: Олимпиады с БВИ или 100 баллами на них, последний год приёма.
                status:
                  type: string
                  enum: [offered, to_check]
                  description: to_check — льготы на всех таких направлениях ещё проверяются.

    ProfileUniversity:
      allOf:
        - $ref: "#/components/schemas/UniversityListItem"
        - type: object
          required: [chosen_directions, target_basis, target_directions]
          properties:
            chosen_directions:
              type: array
              description: Направления, выбранные в этом вузе (F65); пусто — не выбирали.
              items: { $ref: "#/components/schemas/Direction" }
            target_basis: { $ref: "#/components/schemas/TargetBasis" }
            target_directions:
              type: array
              description: На какие направления вуза смотрятся льготы; пусто при `university`.
              items: { $ref: "#/components/schemas/Direction" }

    UniversityDetail:
      allOf:
        - $ref: "#/components/schemas/UniversityListItem"
        - type: object
          required:
            [
              directions,
              ege_note,
              rules_url,
              rules_verified_at,
              description,
              site_url,
              olympiads,
              offered_directions,
              target_basis,
              target_directions,
              target_unverified,
            ]
          properties:
            directions:
              type: array
              deprecated: true
              description: Устарело, вместо него `offered_directions`.
              items: { type: string }
            offered_directions:
              type: array
              description: Направления вуза — выбранные первыми, за ними из цели, дальше по числу олимпиад (F65).
              items: { $ref: "#/components/schemas/OfferedDirection" }
            target_basis: { $ref: "#/components/schemas/TargetBasis" }
            target_directions:
              type: array
              description: На какие направления вуза смотрятся льготы; пусто при `university`.
              items: { $ref: "#/components/schemas/Direction" }
            target_unverified:
              type: boolean
              description: Льготы на направления ученика в вузе ещё уточняются.
            ege_note:
              type: [string, "null"]
              examples: ["от 75 баллов по профильному предмету"]
            rules_url: { type: [string, "null"], format: uri }
            rules_verified_at: { type: [string, "null"], format: date }
            description:
              type: [string, "null"]
              description: Что это за вуз — пара предложений по официальному сайту.
            site_url: { type: [string, "null"], format: uri }
            olympiads:
              type: array
              description: Олимпиады, дающие льготу в этом вузе, с переходом в карточку (F26).
              items:
                allOf:
                  - $ref: "#/components/schemas/Badge"
                  - type: object
                    required:
                      [
                        olympiad_profile_id,
                        name,
                        level,
                        benefit,
                        my_benefit,
                        my_benefit_label,
                        my_directions,
                        directions_count,
                        directions_total,
                      ]
                    properties:
                      olympiad_profile_id: { type: string }
                      olympiad_id: { type: string }
                      name: { type: string }
                      subject_name: { type: string }
                      level: { $ref: "#/components/schemas/Level" }
                      benefit: { $ref: "#/components/schemas/BenefitKind" }
                      benefit_label: { type: string }
                      my_benefit:
                        description: Льгота на мои направления в этом вузе; null — на них льготы нет или она уточняется.
                        oneOf:
                          - $ref: "#/components/schemas/BenefitKind"
                          - type: "null"
                      my_benefit_label: { type: [string, "null"] }
                      my_directions:
                        type: array
                        description: На какие из моих направлений `my_benefit`.
                        items: { type: string }
                      directions_count:
                        type: integer
                        description: На скольких направлениях вуза олимпиада даёт льготу.
                      directions_total:
                        type: integer
                        description: Сколько направлений у вуза в данных.

    TrackerItem:
      allOf:
        - $ref: "#/components/schemas/Badge"
        - type: object
          required:
            [
              id,
              olympiad_profile_id,
              olympiad_id,
              olympiad_name,
              subject_name,
              kind,
              level,
              deadline_at,
              next_stage_title,
              registered_at,
              registered_by,
              added_by,
              status,
              outcome,
              stages,
              action,
            ]
          properties:
            id: { type: string, format: uuid }
            olympiad_profile_id: { type: string }
            olympiad_id: { type: string }
            olympiad_name: { type: string }
            subject_name: { type: string }
            kind: { $ref: "#/components/schemas/OlympiadKind" }
            level: { $ref: "#/components/schemas/Level" }
            deadline_at: { type: [string, "null"], format: date-time }
            next_stage_title:
              type: [string, "null"]
              examples: ["Регистрация", "Школьный этап", "Отборочный этап"]
            registered_at: { type: [string, "null"], format: date-time }
            registered_by:
              oneOf:
                - $ref: "#/components/schemas/MemberBrief"
                - type: "null"
              description: Кто поставил отметку — строка «Отметила Ольга» (F31).
            added_by:
              oneOf:
                - $ref: "#/components/schemas/MemberBrief"
                - type: "null"
              description: Кто добавил — пометка «добавил(а) <имя>» (ТЗ §3.2).
            status:
              type: string
              enum: [open, active, finished]
              description: |
                open — нужно зарегистрироваться, active — участвует,
                finished — участие закончено (итог или регистрация закрылась).
            outcome:
              type: [string, "null"]
              enum: [failed, winner, prizer, participant, missed, unknown, null]
              description: |
                Чем закончилось участие: итог этапа, missed — регистрация
                закрылась без отметки, unknown — сезон прошёл, итог не отмечен.
            stages:
              type: array
              items: { $ref: "#/components/schemas/TrackerStage" }
            action:
              oneOf:
                - $ref: "#/components/schemas/TrackerAction"
                - type: "null"
              description: Одна строка действия в карточке — что отметить сейчас.

    StageResult:
      type: string
      enum: [passed, failed, winner, prizer, participant]
      description: |
        Итог этапа: passed — прошёл дальше, failed — не прошёл; у последнего
        заключительного — winner, prizer, participant (без диплома).

    TrackerStage:
      type: object
      required:
        [
          id,
          kind,
          title,
          subtitle,
          starts_at,
          ends_at,
          deadline_at,
          state,
          registered,
          result,
          can_register,
          results,
          results_allowed,
          asking,
        ]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/StageKind" }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        deadline_at: { type: [string, "null"], format: date-time }
        state:
          type: string
          enum: [past, current, future, locked]
          description: locked — после закрывающего итога.
        registered: { type: boolean }
        result:
          oneOf:
            - $ref: "#/components/schemas/StageResult"
            - type: "null"
        can_register:
          type: boolean
          description: Отметку регистрации можно поставить или снять сейчас.
        results:
          type: array
          items: { $ref: "#/components/schemas/StageResult" }
          description: Какие итоги бывают у этапа.
        results_allowed:
          type: array
          items: { $ref: "#/components/schemas/StageResult" }
          description: Какие итоги можно поставить сейчас (этап начался, отметки не противоречат).
        asking:
          type: boolean
          description: Этап закончился, итог ждёт отметки.

    TrackerAction:
      type: object
      required: [type, stage_id]
      properties:
        type:
          type: string
          enum: [register, result]
        stage_id:
          type: [string, "null"]
          description: Без этапа — «участвую» у олимпиады без этапа-регистрации (PUT /tracker/{id}/registered).

    Proposal:
      allOf:
        - $ref: "#/components/schemas/Badge"
        - type: object
          required:
            [
              id,
              olympiad_profile_id,
              olympiad_id,
              olympiad_name,
              deadline_at,
              status,
              proposed_by,
              created_at,
              resolved_at,
            ]
          properties:
            id: { type: string, format: uuid }
            olympiad_profile_id: { type: string }
            olympiad_id: { type: string }
            olympiad_name: { type: string }
            deadline_at: { type: [string, "null"], format: date-time }
            status:
              type: string
              enum: [pending, accepted, declined]
            proposed_by: { $ref: "#/components/schemas/MemberBrief" }
            created_at: { type: string, format: date-time }
            resolved_at: { type: [string, "null"], format: date-time }

    Tracker:
      type: object
      required: [items, proposals]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TrackerItem" }
        proposals:
          type: array
          description: |
            Ученику — предложения, ждущие его ответа. Родителю — его же
            предложения со статусом «ждёт подтверждения» (ТЗ E1/E3).
          items: { $ref: "#/components/schemas/Proposal" }

    CalendarLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: Путь относительно базового адреса API, с токеном.
          example: "/calendar.ics?token=eyJhbGciOiJIUzI1NiJ9…"
        expires_at: { type: string, format: date-time }

    CalendarMonth:
      type: object
      required: [month, days]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        days:
          type: array
          items:
            type: object
            required: [date, items]
            properties:
              date: { type: string, format: date }
              items:
                type: array
                items: { $ref: "#/components/schemas/TrackerItem" }

    MemberBrief:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Member:
      allOf:
        - $ref: "#/components/schemas/MemberBrief"
        - type: object
          required: [is_creator, is_me, can_remove, joined_at]
          properties:
            is_creator: { type: boolean }
            is_me: { type: boolean }
            can_remove:
              type: boolean
              description: Сервер уже учёл матрицу прав — создателя и себя удалить нельзя.
            color: { type: [string, "null"], pattern: '^#[0-9A-Fa-f]{6}$' }
            joined_at: { type: string, format: date-time }

    Invite:
      type: object
      required: [id, token, url, role, can_revoke, created_at]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, minLength: 12, pattern: '^[A-Za-z0-9_-]+$' }
        url:
          type: string
          format: uri
          description: Готовая ссылка `https://max.ru/<bot>?start=inv_<token>` (F39).
        role: { $ref: "#/components/schemas/Role" }
        can_revoke:
          type: boolean
          description: Смотрящий может отозвать ссылку — он её автор или создатель траектории (ТЗ §16).
        created_at: { type: string, format: date-time }

    Family:
      type: object
      required: [trajectory, members, invites]
      properties:
        trajectory: { $ref: "#/components/schemas/TrajectorySummary" }
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        invites:
          type: array
          description: Активные, ещё не использованные ссылки.
          items: { $ref: "#/components/schemas/Invite" }

    Profile:
      type: object
      required:
        [
          student_name,
          grade,
          region_code,
          region_name,
          subjects,
          directions,
          goal_status,
          target_region_code,
          target_region_name,
          experience,
          home_city,
          places,
          universities,
          other_member_names,
        ]
      properties:
        student_name: { type: string, minLength: 1, maxLength: 40 }
        grade: { type: integer, enum: [8, 9, 10, 11] }
        region_code:
          type: string
          description: Код субъекта РФ; пустая строка — регион не указан.
        region_name:
          type: string
          description: Пустая строка, если регион не указан.
        subjects:
          type: array
          minItems: 1
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
        directions:
          type: array
          items: { $ref: "#/components/schemas/Direction" }
        goal_status: { type: string, enum: [known, suggested, exploring] }
        target_region_code:
          type: [string, "null"]
          deprecated: true
          description: Первое место из `places` — код субъекта РФ; null — не важно. Устарело, вместо него `places`.
          examples: ["77"]
        target_region_name: { type: [string, "null"], deprecated: true, examples: ["Москва"] }
        experience:
          type: [string, "null"]
          enum: [none, school, region, null]
          description: "Опыт в олимпиадах: none — пока не было, school — школьный или муниципальный этап, region — региональный и выше. null — не спрашивали, подбор считает как none."
        home_city:
          type: [string, "null"]
          description: Город ученика, если известен (из поиска или геолокации в боте).
          examples: ["Казань"]
        places:
          type: array
          description: Где ученик хочет учиться, в порядке выбора; пустой список — не важно.
          items: { $ref: "#/components/schemas/Place" }
        universities:
          type: array
          description: Может быть пустым — вузы выбирать не обязательно (F9).
          items: { $ref: "#/components/schemas/ProfileUniversity" }
        other_member_names:
          type: array
          description: "Имена остальных участников — «Изменения увидят все участники: Ольга, Игорь»."
          items: { type: string }

    ProfilePatch:
      type: object
      minProperties: 1
      properties:
        student_name: { type: string, minLength: 1, maxLength: 40 }
        grade: { type: integer, enum: [8, 9, 10, 11] }
        region_code:
          type: string
          description: Код субъекта РФ, часовой пояс — по нему; пустая строка — регион не указан, время московское.
        subject_codes:
          type: array
          minItems: 1
          items: { type: string }
        direction_ids:
          type: array
          description: Направления в порядке выбора; пустой список — «пока не решил».
          items: { type: string }
        target_region_code:
          type: string
          deprecated: true
          description: Код субъекта РФ, где ученик хочет учиться; пустая строка — не важно. Устарело, вместо него `places`; игнорируется, если передан `places`.
        places:
          type: array
          maxItems: 10
          description: Где ученик хочет учиться; пустой список — не важно, повторы отбрасываются.
          items:
            type: object
            required: [region_code]
            properties:
              region_code: { type: string, examples: ["16"] }
              city:
                type: [string, "null"]
                maxLength: 80
                description: Город внутри региона; null — весь регион.
        experience:
          type: string
          enum: [none, school, region]
        university_ids:
          type: array
          items: { type: string }

    Place:
      type: object
      required: [region_code, region_name, city]
      properties:
        region_code: { type: string, examples: ["16"] }
        region_name: { type: string, examples: ["Республика Татарстан"] }
        city:
          type: [string, "null"]
          description: Город внутри региона; null — весь регион.
          examples: ["Казань"]

    AiCardRef:
      type: object
      description: Ссылка на карточку нашей базы — кнопка «Карточка «…»» под ответом (F35).
      required: [type, id, title]
      properties:
        type:
          type: string
          enum: [olympiad, university]
        id:
          type: string
          description: "`olympiad_profile_id` или `universities.id` — по чему открывать карточку."
        title: { type: string }

    AiMessage:
      type: object
      required: [id, role, text, card_refs, sources, refused, created_at]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant]
        text: { type: string }
        card_refs:
          type: array
          items: { $ref: "#/components/schemas/AiCardRef" }
        sources:
          type: array
          description: Ссылки на первоисточники под ответом.
          items: { $ref: "#/components/schemas/Source" }
        refused:
          type: boolean
          description: "`true` — честное «данных нет» (F36). Клиент рисует жёлтым."
        created_at: { type: string, format: date-time }

    AiChat:
      type: object
      required: [id, title, created_at, last_message_at]
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
          minLength: 1
          maxLength: 60
          examples: ["Чат 23 сентября", "Льготы в ИТМО"]
        created_at: { type: string, format: date-time }
        last_message_at:
          type: string
          format: date-time
          description: Время последней реплики — по нему список идёт от свежих к старым.

    AiQuestion:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500

    AiExchange:
      type: object
      description: Пара вопрос–ответ и чат, в котором она сохранена.
      required: [chat, question, answer]
      properties:
        chat: { $ref: "#/components/schemas/AiChat" }
        question: { $ref: "#/components/schemas/AiMessage" }
        answer: { $ref: "#/components/schemas/AiMessage" }
