# План инфраструктуры на каждый PR, затрагивающий Terraform.
#
# Ничего не применяет. Задача — показать ревьюеру, что именно изменится,
# ДО слияния. Главное, на что смотреть в выводе: строка `destroy`.
# Удаление бакета уронит мини-приложение у организаторов, пересоздание
# функции сменит URL вебхука и потребует перерегистрации подписки в MAX.
name: Infra plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-plan.yml'

permissions:
  contents: read
  # Нужно, чтобы запостить план комментарием в PR.
  pull-requests: write

concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: infra/terraform
    env:
      # Провайдер логинится ключом сервисного аккаунта, а не IAM-токеном:
      # токен живёт 12 часов и как секрет репозитория бесполезен.
      YC_SERVICE_ACCOUNT_KEY_FILE: ${{ github.workspace }}/infra-key.json
      # Доступ к бакету с состоянием: бэкенд S3 ходит туда этими ключами.
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_KEY }}
      # Те же значения, что у infra-apply: иначе план в PR показывал бы
      # удаление записей Lockbox и выключенных флагами ресурсов, которых
      # apply на самом деле не тронет. Переменные sensitive — в плане
      # и в комментарии они видны как (sensitive value).
      TF_VAR_pg_password: ${{ secrets.PG_PASSWORD }}
      TF_VAR_max_bot_token: ${{ secrets.MAX_BOT_TOKEN }}
      TF_VAR_webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_polza_ai_api_key: ${{ secrets.POLZA_AI_API_KEY }}
      TF_VAR_enable_workers: ${{ vars.ENABLE_WORKERS || 'false' }}
      TF_VAR_enable_database: ${{ vars.ENABLE_DATABASE || 'false' }}
      TF_VAR_enable_domain_https: ${{ vars.ENABLE_DOMAIN_HTTPS || 'false' }}
      TF_VAR_enable_browser_demo: ${{ vars.ENABLE_BROWSER_DEMO || 'false' }}
      # Открытый ключ — не секрет, поэтому переменная, а не secret: так видно,
      # чей он, и его можно сверить глазами на ревью.
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      # Списочная переменная приходит как JSON. По умолчанию пусто — SSH к базе
      # закрыт всем, и открывается осознанно на время прогона Ansible.
      TF_VAR_ssh_allowed_cidrs: ${{ vars.SSH_ALLOWED_CIDRS || '[]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ключ сервисного аккаунта
        env:
          SA_KEY: ${{ secrets.YC_INFRA_KEY }}
        run: printf '%s' "$SA_KEY" > "${{ github.workspace }}/infra-key.json"

      - uses: opentofu/setup-opentofu@v1

      # Путь считаем здесь, а не в env уровня job: tofu не разворачивает `~`,
      # он уходит к нему литералом, и кеш провайдеров молча не работает.
      - name: Каталог кеша провайдеров
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"

      - name: Инициализация
        run: |
          tofu init -input=false

      # План берёт блокировку состояния. Ждём, а не падаем сразу: рядом может
      # идти другой прогон, и 5 минут ожидания дешевле красного PR.
      - name: План
        id: plan
        run: |
          set +e
          tofu plan -input=false -no-color -lock-timeout=5m > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          # Секретов в выводе быть не должно, но вывод публичный —
          # оставляем только хвост со сводкой и списком изменений.
          tail -c 60000 plan.txt > plan-short.txt

      - name: Комментарий в PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan-short.txt', 'utf8');
            const failed = '${{ steps.plan.outputs.exitcode }}' !== '0';
            const body = [
              failed ? '### План не собрался' : '### План инфраструктуры',
              '',
              'Проверьте строку `Plan:` — любое `destroy` требует объяснения.',
              '',
              '<details><summary>Вывод tofu plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Свалиться, если план не собрался
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

      - name: Удалить ключ
        if: always()
        run: rm -f "${{ github.workspace }}/infra-key.json"
