# Применение инфраструктуры. Только вручную.
#
# Автоматического запуска при слиянии нет намеренно. Выкладка кода обратима —
# откатился на предыдущую версию функции и живёшь. Выкладка инфраструктуры нет:
# удалённый бакет уронит мини-приложение у организаторов, пересозданная функция
# сменит URL вебхука. Перед запуском план смотрит второй человек — по
# договорённости команды, технически это не принуждается (см. ниже).
#
# В окне проверки 30.09-14.10 этот workflow не запускается вообще, кроме аварии.
name: Infra apply

on:
  # Флагов enable_* во входах нет намеренно: снятая по забывчивости галочка
  # enable_workers удалила бы api, воркеры и шлюз. Флаги лежат в переменных
  # репозитория ENABLE_WORKERS, ENABLE_DATABASE, ENABLE_DOMAIN_HTTPS и
  # описывают, какой прод должен быть, — теми же значениями считает infra-plan.
  workflow_dispatch:

# Два одновременных apply заблокируются на состоянии, но лучше не доводить.
concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux]
    # Обязательные ревьюеры окружения на бесплатном плане приватного репозитория
    # недоступны (API отвечает 422), поэтому запуск НЕ ждёт подтверждения.
    # Окружение оставлено ради разграничения секретов и истории выкладок.
    environment: production-infra
    defaults:
      run:
        working-directory: infra/terraform
    env:
      # Провайдер логинится ключом сервисного аккаунта, а не IAM-токеном:
      # токен живёт 12 часов и как секрет репозитория бесполезен.
      YC_SERVICE_ACCOUNT_KEY_FILE: ${{ github.workspace }}/infra-key.json
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_KEY }}
      # Секреты приложения уходят в Lockbox (secrets.tf). Пустое значение
      # Terraform из Lockbox убирает — поэтому ниже apply без них не запускается.
      TF_VAR_pg_password: ${{ secrets.PG_PASSWORD }}
      TF_VAR_max_bot_token: ${{ secrets.MAX_BOT_TOKEN }}
      TF_VAR_webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_polza_ai_api_key: ${{ secrets.POLZA_AI_API_KEY }}
      TF_VAR_enable_workers: ${{ vars.ENABLE_WORKERS || 'false' }}
      TF_VAR_enable_database: ${{ vars.ENABLE_DATABASE || 'false' }}
      TF_VAR_enable_domain_https: ${{ vars.ENABLE_DOMAIN_HTTPS || 'false' }}
      TF_VAR_enable_browser_demo: ${{ vars.ENABLE_BROWSER_DEMO || 'false' }}
      # Открытый ключ — не секрет, поэтому переменная, а не secret: так видно,
      # чей он, и его можно сверить глазами на ревью.
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      # Списочная переменная приходит как JSON. По умолчанию пусто — SSH к базе
      # закрыт всем, и открывается осознанно на время прогона Ansible.
      TF_VAR_ssh_allowed_cidrs: ${{ vars.SSH_ALLOWED_CIDRS || '[]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Секреты приложения на месте
        working-directory: .
        run: |
          missing=""
          for v in TF_VAR_max_bot_token TF_VAR_webhook_secret TF_VAR_jwt_secret; do
            [ -n "${!v}" ] || missing="$missing $(echo "${v#TF_VAR_}" | tr a-z A-Z)"
          done
          if [ "$TF_VAR_enable_database" = "true" ]; then
            [ -n "$TF_VAR_pg_password" ] || missing="$missing PG_PASSWORD"
            # Без ключа ВМ поднимется, но войти в неё будет нечем, а значит
            # Ansible не настроит СУБД и база останется пустой железкой.
            [ -n "$TF_VAR_ssh_public_key" ] || missing="$missing SSH_PUBLIC_KEY(переменная)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing (имена — в .github/workflows/README.md)"
            exit 1
          fi

      - name: Ключ сервисного аккаунта
        env:
          SA_KEY: ${{ secrets.YC_INFRA_KEY }}
        run: printf '%s' "$SA_KEY" > "${{ github.workspace }}/infra-key.json"

      - uses: opentofu/setup-opentofu@v1

      # Путь считаем здесь, а не в env уровня job: tofu не разворачивает `~`,
      # он уходит к нему литералом, и кеш провайдеров молча не работает.
      - name: Каталог кеша провайдеров
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"

      - name: Кеш провайдеров
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-providers-${{ hashFiles('infra/terraform/.terraform.lock.hcl') }}
          restore-keys: tofu-providers-

      - name: Инициализация
        run: |
          tofu init -input=false

      # Если apply меняет настройки функции, Terraform выкладывает новую версию
      # из своего архива исходников. Коммит в ней должен быть настоящим, как
      # при Deploy functions, а не «dev».
      - name: Версия в архиве функций
        run: printf '%s\n' "${GITHUB_SHA::7}" > "${{ github.workspace }}/packages/shared/version/commit.txt"

      # Применяется ровно тот план, который собран и показан в логе.
      # Раздельные plan и apply позволили бы состоянию измениться между ними,
      # и apply сделал бы не то, что было видно.
      - name: План
        run: |
          tofu plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Применение
        run: tofu apply -input=false -no-color -lock-timeout=5m tfplan

      - name: Что живо после применения
        run: |
          tofu output -json | python3 -c "
          import json,sys
          for k, v in json.load(sys.stdin).items():
              print(f'{k}: {\"(скрыто)\" if v.get(\"sensitive\") else v.get(\"value\")}')
          "

      - name: Удалить ключ
        if: always()
        run: rm -f "${{ github.workspace }}/infra-key.json"
