# Проверки на каждый пуш и PR. Всё то же самое запускается локально через make.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      # Интеграционные тесты store и сценариев идут против настоящего Postgres
      # той же версии, что в compose и в Managed PostgreSQL.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traektoria
          POSTGRES_PASSWORD: traektoria
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traektoria"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://traektoria:traektoria@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Ровно рантайм Yandex Cloud Functions (golang123).
          go-version: "1.23.12"
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: build
        run: make build GO=go
      - name: test
        run: go test -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: генератор сида
        run: python -m unittest discover -s datasets/parser -p 'test_*.py'

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contrast
